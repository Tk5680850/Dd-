name: Build StepSync (单机版无授权)
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write sources
        run: |
          mkdir -p StepSync
          echo "aW1wb3J0IFN3aWZ0VUkKaW1wb3J0IEhlYWx0aEtpdAppbXBvcnQgVUlLaXQKCkBtYWluCnN0cnVjdCBTdGVwU3luY0FwcDogQXBwIHsKICAgIHZhciBib2R5OiBzb21lIFNjZW5lIHsKICAgICAgICBXaW5kb3dHcm91cCB7CiAgICAgICAgICAgIENvbnRlbnRWaWV3KCkKICAgICAgICB9CiAgICB9Cn0K" | base64 -d > StepSync/StepSyncApp.swift
          echo "" | base64 -d > StepSync/ContentView.swift
          echo "" | base64 -d > StepSync/Info.plist
          echo "" | base64 -d > StepSync/StepSync.entitlements
          echo "" | base64 -d > StepSync/project.yml
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive (unsigned)
        run: |
          xcodebuild -project StepSync.xcodeproj -scheme StepSync -sdk iphoneos -configuration Release -archivePath "$PWD/build/StepSync.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive
      - name: Package IPA (ad-hoc + healthkit entitlement)
        run: |
          rm -rf Payload && mkdir -p Payload
          cp -r "$PWD/build/StepSync.xcarchive/Products/Applications/StepSync.app" Payload/
          codesign -f -s - --entitlements StepSync/StepSync.entitlements Payload/StepSync.app
          zip -r StepSync.ipa Payload
      - name: Upload IPA (guaranteed)
        uses: actions/upload-artifact@v4
        with:
          name: StepSync.ipa
          path: StepSync.ipa
      - name: Build .deb for Sileo/Filza
        continue-on-error: true
        run: |
          brew install dpkg || true
          rm -rf deb && mkdir -p deb/DEBIAN deb/Applications
          cp -r Payload/StepSync.app deb/Applications/StepSync.app
          cat > deb/DEBIAN/control <<'CONTROL_EOF'
          Package: com.stepsync.app
          Name: 步数写入 (单机版)
          Version: 1.0
          Architecture: iphoneos-arm
          Description: 单机版无授权步数修改，写入苹果健康
          Maintainer: you <you@example.com>
          Section: Utilities
          CONTROL_EOF
          cat > deb/DEBIAN/postinst <<'POST_EOF'
          #!/bin/bash
          uicache 2>/dev/null || true
          exit 0
          POST_EOF
          chmod 0755 deb/DEBIAN/postinst
          dpkg-deb -b deb StepSync.deb
      - name: Upload .deb
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: StepSync.deb
          path: StepSync.deb

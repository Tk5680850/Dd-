name: Build StepSync (rootless / var-jb)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write sources
        run: |
          cat > StepSyncApp.swift <<'SWIFT_EOF'
          import SwiftUI
          import HealthKit

          @main
          struct StepSyncApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct ContentView: View {
              @State private var countText: String = "10000"
              @State private var status: String = "输入步数后点写入，或快捷指令 stepsync://write?count=15000"
              @State private var busy: Bool = false
              private let healthStore = HKHealthStore()

              var body: some View {
                  NavigationView {
                      VStack(spacing: 18) {
                          Text("StepSync 步数写入").font(.title2).bold()
                          TextField("步数", text: $countText)
                              .keyboardType(.numberPad)
                              .textFieldStyle(RoundedBorderTextFieldStyle())
                              .padding(.horizontal)
                          Button(action: writeSteps) {
                              if busy {
                                  ProgressView()
                              } else {
                                  Text("写入今日步数").bold()
                              }
                          }
                          .disabled(busy)
                          .padding(.horizontal, 28)
                          .padding(.vertical, 12)
                          .background(Color.blue)
                          .foregroundColor(.white)
                          .cornerRadius(10)
                          Text(status)
                              .font(.footnote)
                              .foregroundColor(.secondary)
                              .multilineTextAlignment(.center)
                              .padding(.horizontal)
                          Spacer()
                      }
                      .padding()
                      .navigationTitle("StepSync")
                      .onOpenURL { url in handleURL(url) }
                  }
              }

              func writeSteps() {
                  guard let n = Int(countText), n > 0 else {
                      status = "⚠️ 请输入有效步数"
                      return
                  }
                  busy = true
                  status = "检查健康授权…"
                  let type = HKQuantityType.quantityType(forIdentifier: .stepCount)!
                  let cur = healthStore.authorizationStatus(for: type)
                  if cur != .sharingAuthorized {
                      healthStore.requestAuthorization(toShare: [type], read: [type]) { ok, _ in
                          if !ok {
                              DispatchQueue.main.async {
                                  busy = false
                                  status = "⚠️ 未获健康写入权限：去 iPhone「健康」→ 头像 → 数据来源 → StepSync，打开步数写入开关"
                              }
                              return
                          }
                          self.save(count: n)
                      }
                      return
                  }
                  save(count: n)
              }

              func save(count n: Int) {
                  let type = HKQuantityType.quantityType(forIdentifier: .stepCount)!
                  let now = Date()
                  let start = Calendar.current.startOfDay(for: now)
                  let sample = HKQuantitySample(
                      type: type,
                      quantity: HKQuantity(unit: .count(), doubleValue: Double(n)),
                      start: start,
                      end: now
                  )
                  healthStore.save(sample) { success, error in
                      DispatchQueue.main.async {
                          busy = false
                          if success {
                              status = "✅ 已写入 \(n) 步"
                          } else {
                              status = "⚠️ 写入失败：\(error?.localizedDescription ?? "未知错误")"
                          }
                      }
                  }
              }

              func handleURL(_ url: URL) {
                  guard let comps = URLComponents(url: url, resolvingAgainstBaseURL: false) else { return }
                  if let c = comps.queryItems?.first(where: { $0.name == "count" })?.value, let n = Int(c) {
                      countText = String(n)
                      writeSteps()
                      return
                  }
                  if let loS = comps.queryItems?.first(where: { $0.name == "min" })?.value,
                     let hiS = comps.queryItems?.first(where: { $0.name == "max" })?.value,
                     let lo = Int(loS), let hi = Int(hiS), hi >= lo {
                      let n = Int.random(in: lo...hi)
                      countText = String(n)
                      writeSteps()
                  }
              }
          }
          SWIFT_EOF

          cat > project.yml <<'YML_EOF'
          name: StepSync
          options:
            bundleIdPrefix: com.stepsync
            deploymentTarget:
              iOS: "15.0"
          targets:
            StepSync:
              type: application
              platform: iOS
              sources:
                - path: StepSyncApp.swift
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: StepSync
                  CFBundleURLTypes:
                    - CFBundleURLName: stepsync
                      CFBundleURLSchemes:
                        - stepsync
                  NSHealthUpdateUsageDescription: "StepSync 需要把步数写入您的健康"
                  NSHealthShareUsageDescription: "StepSync 需要读取您的步数以回显"
              entitlements:
                path: StepSync.entitlements
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.stepsync.stepsync
                  CODE_SIGN_ENTITLEMENTS: StepSync.entitlements
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          YML_EOF

          cat > StepSync.entitlements <<'ENT_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.healthkit</key>
              <true/>
          </dict>
          </plist>
          ENT_EOF

      - name: Generate Xcode project
        run: |
          {
            set -x
            ls -la
            cat project.yml
            xcodegen generate
            echo "GEN_EXIT=$?"
            ls -la StepSync.xcodeproj 2>&1
            sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 56/' StepSync.xcodeproj/project.pbxproj
            grep -n "objectVersion" StepSync.xcodeproj/project.pbxproj | head -1
          } 2>&1 | tee /tmp/gen.log
          if ! [ -d StepSync.xcodeproj ]; then
            echo "::error::XCODEGEN FAILED — 见 run 日志"
            exit 1
          fi

      - name: Build (unsigned)
        run: |
          set -x
          xcodebuild -list -project StepSync.xcodeproj 2>&1 | tee /tmp/list.log
          xcodebuild -project StepSync.xcodeproj -scheme StepSync -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::BUILD FAILED — 错误摘要见 run summary"
            tail -120 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          find build -name "StepSync.app" -maxdepth 4 2>&1

      - name: Package IPA (ad-hoc + healthkit entitlement)
        run: |
          rm -rf Payload && mkdir -p Payload
          APP=$(find build -name "StepSync.app" -maxdepth 4 | head -1)
          echo "找到 APP: $APP"
          cp -r "$APP" Payload/
          PLIST="Payload/StepSync.app/Info.plist"
          set_plist () {
            /usr/libexec/PlistBuddy -c "Set $1 \"$3\"" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add $1 $2 \"$3\"" "$PLIST" 2>/dev/null
          }
          set_plist :NSHealthShareUsageDescription string "用于读取步数并同步到钉钉运动"
          set_plist :NSHealthUpdateUsageDescription string "用于把步数写入苹果健康，供钉钉运动读取"
          set_plist :CFBundleDisplayName string "步数写入"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0" "$PLIST" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          set_plist :CFBundleURLTypes:0:CFBundleURLName string "com.stepsync.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes" "$PLIST" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          set_plist :CFBundleURLTypes:0:CFBundleURLSchemes:0 string "stepsync"
          echo "--- 注入后校验 ---"
          /usr/libexec/PlistBuddy -c "Print :NSHealthUpdateUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$PLIST"
          codesign -f -s - --entitlements StepSync.entitlements Payload/StepSync.app
          zip -r StepSync.ipa Payload

      - name: Build .deb (ROOTLESS / var-jb / iphoneos-arm64)
        run: |
          brew install dpkg || true
          rm -rf deb && mkdir -p deb/DEBIAN deb/var/jb/Applications
          cp -r Payload/StepSync.app deb/var/jb/Applications/StepSync.app
          cat > deb/DEBIAN/control <<'CONTROL_EOF'
          Package: com.stepsync.stepsync
          Name: 步数写入
          Version: 1.0.2
          Architecture: iphoneos-arm64
          Description: 步数写入苹果健康（rootless 越狱 / var-jb）
          Maintainer: Tk5680850
          Section: Utilities
          CONTROL_EOF
          cat > deb/DEBIAN/postinst <<'POST_EOF'
          #!/bin/bash
          uicache 2>/dev/null || true
          exit 0
          POST_EOF
          chmod 0755 deb/DEBIAN/postinst
          dpkg-deb -b deb StepSync.deb
          ls -la StepSync.deb

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rootless-build-${{ github.run_number }}
          name: StepSync rootless build #${{ github.run_number }}
          files: StepSync.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

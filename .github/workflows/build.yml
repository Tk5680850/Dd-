name: Build StepSync (支持远程更新)
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths-ignore:
      - 'ci-diag.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write sources
        run: |
          mkdir -p StepSync
          echo "aW1wb3J0IFN3aWZ0VUkKaW1wb3J0IEhlYWx0aEtpdAppbXBvcnQgVUlLaXQKCkBtYWluCnN0cnVjdCBTdGVwU3luY0FwcDogQXBwIHsKICAgIHZhciBib2R5OiBzb21lIFNjZW5lIHsKICAgICAgICBXaW5kb3dHcm91cCB7CiAgICAgICAgICAgIENvbnRlbnRWaWV3KCkKICAgICAgICB9CiAgICB9Cn0K" | base64 -d > StepSync/StepSyncApp.swift
          echo "" | base64 -d > StepSync/ContentView.swift
          echo "" | base64 -d > StepSync/Info.plist
          echo "" | base64 -d > StepSync/StepSync.entitlements
          echo "" | base64 -d > project.yml
      - name: Set version (CFBundleVersion = run number，用于 App 内自更新比对)
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" StepSync/Info.plist
      - name: Generate Xcode project
        run: |
          {
            set -x
            ls -la
            cat project.yml
            xcodegen generate
            echo "GEN_EXIT=$?"
            ls -la StepSync.xcodeproj 2>&1
            # 强制 objectVersion 兼容 runner 的 Xcode 15.4 (认 objectVersion 56)
            sed -i '' -E 's/objectVersion = [0-9]+/objectVersion = 56/' StepSync.xcodeproj/project.pbxproj
            echo "--- objectVersion now ---"
            grep -n "objectVersion" StepSync.xcodeproj/project.pbxproj | head -1
          } 2>&1 | tee /tmp/gen.log
          if ! [ -d StepSync.xcodeproj ]; then
            echo "::error::XCODEGEN FAILED — 见仓库 ci-diag.txt"
            exit 1
          fi
      - name: Build (unsigned)
        run: |
          set -x
          xcodebuild -list -project StepSync.xcodeproj 2>&1 | tee /tmp/list.log
          xcodebuild -project StepSync.xcodeproj -scheme StepSync -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::BUILD FAILED — 错误摘要见 run summary"
            tail -120 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          find build -name "StepSync.app" -maxdepth 4 2>&1
      - name: Package IPA (ad-hoc + healthkit entitlement)
        run: |
          rm -rf Payload && mkdir -p Payload
          APP=$(find build -name "StepSync.app" -maxdepth 4 | head -1)
          echo "找到 APP: $APP"
          cp -r "$APP" Payload/
          # ===== 关键修复：XcodeGen 在本 runner 未把自定义 Info.plist 的键合进产物，
          # Xcode 退回生成了“最小 plist”，导致 HealthKit 权限描述与 stepsync:// URL Scheme 丢失
          # （缺 NSHealthUpdateUsageDescription 写步数会直接崩溃；缺 CFBundleURLTypes 快捷指令唤不动）。
          # 这里用 PlistBuddy 把关键键兜底写回最终 IPA，确保功能可用。 =====
          PLIST="Payload/StepSync.app/Info.plist"
          set_plist () {
            /usr/libexec/PlistBuddy -c "Set $1 \"$3\"" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add $1 $2 \"$3\"" "$PLIST" 2>/dev/null
          }
          set_plist :NSHealthShareUsageDescription string "用于读取步数并同步到钉钉运动"
          set_plist :NSHealthUpdateUsageDescription string "用于把步数写入苹果健康，供钉钉运动读取"
          set_plist :CFBundleDisplayName string "步数写入"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0" "$PLIST" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          set_plist :CFBundleURLTypes:0:CFBundleURLName string "com.stepsync.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes" "$PLIST" >/dev/null 2>&1 \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          set_plist :CFBundleURLTypes:0:CFBundleURLSchemes:0 string "stepsync"
          echo "--- 注入后 Info.plist 关键键校验 ---"
          /usr/libexec/PlistBuddy -c "Print :NSHealthUpdateUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$PLIST"
          codesign -f -s - --entitlements StepSync/StepSync.entitlements Payload/StepSync.app
          zip -r StepSync.ipa Payload
      - name: Upload IPA (guaranteed)
        uses: actions/upload-artifact@v4
        with:
          name: StepSync.ipa
          path: StepSync.ipa
      - name: Build .deb for Sileo/Filza (远程自更新源，必出)
        run: |
          brew install dpkg
          rm -rf deb && mkdir -p deb/DEBIAN deb/Applications
          cp -r Payload/StepSync.app deb/Applications/StepSync.app
          cat > deb/DEBIAN/control <<'CONTROL_EOF'
          Package: com.stepsync.app
          Name: 步数写入
          Version: ${{ github.run_number }}
          Architecture: iphoneos-arm
          Description: 写入苹果健康步数，支持 App 内远程自更新
          Maintainer: you <you@example.com>
          Section: Utilities
          CONTROL_EOF
          cat > deb/DEBIAN/postinst <<'POST_EOF'
          #!/bin/bash
          uicache 2>/dev/null || true
          exit 0
          POST_EOF
          chmod 0755 deb/DEBIAN/postinst
          dpkg-deb -b deb StepSync.deb
      - name: Upload .deb
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: StepSync.deb
          path: StepSync.deb
      - name: Publish Release (远程更新源)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: StepSync v${{ github.run_number }}
          files: |
            StepSync.ipa
            StepSync.deb
          body: |
            自动构建发布。App 内「检查更新」会拉取本 Release 的 .deb 自装更新（需 rootful 越狱环境；非 root 会回退到手动安装）。
            版本号 = 本次运行序号，App 比对 CFBundleVersion 自动提示更新。


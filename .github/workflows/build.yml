name: Build StepSync (rootless)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (xcodegen / ldid / dpkg)
        run: brew install xcodegen dpkg

      - name: Write sources
        run: |
          cat > StepSyncApp.swift <<'SWIFT_EOF'
          import SwiftUI
          import HealthKit

          @main
          struct StepSyncApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct ContentView: View {
              @State private var countText: String = "10000"
              @State private var status: String = "输入步数后点写入，或快捷指令 stepsync://write?count=15000"
              @State private var busy: Bool = false
              private let healthStore = HKHealthStore()

              var body: some View {
                  NavigationView {
                      VStack(spacing: 18) {
                          Text("StepSync 步数写入").font(.title2).bold()
                          TextField("步数", text: $countText)
                              .keyboardType(.numberPad)
                              .textFieldStyle(RoundedBorderTextFieldStyle())
                              .padding(.horizontal)
                          Button(action: writeSteps) {
                              if busy {
                                  ProgressView()
                              } else {
                                  Text("写入今日步数").bold()
                              }
                          }
                          .disabled(busy)
                          .padding(.horizontal, 28)
                          .padding(.vertical, 12)
                          .background(Color.blue)
                          .foregroundColor(.white)
                          .cornerRadius(10)
                          Text(status)
                              .font(.footnote)
                              .foregroundColor(.secondary)
                              .multilineTextAlignment(.center)
                              .padding(.horizontal)
                          Spacer()
                      }
                      .padding()
                      .navigationTitle("StepSync")
                      .onOpenURL { url in handleURL(url) }
                  }
              }

              func writeSteps() {
                  guard let n = Int(countText), n > 0 else {
                      status = "⚠️ 请输入有效步数"
                      return
                  }
                  busy = true
                  status = "检查健康授权…"
                  let type = HKQuantityType.quantityType(forIdentifier: .stepCount)!
                  let cur = healthStore.authorizationStatus(for: type)
                  if cur != .sharingAuthorized {
                      healthStore.requestAuthorization(toShare: [type], read: [type]) { ok, _ in
                          if !ok {
                              DispatchQueue.main.async {
                                  busy = false
                                  status = "⚠️ 未获健康写入权限：去 iPhone「健康」→ 头像 → 数据来源 → StepSync，打开步数写入开关"
                              }
                              return
                          }
                          self.save(count: n)
                      }
                      return
                  }
                  save(count: n)
              }

              func save(count n: Int) {
                  let type = HKQuantityType.quantityType(forIdentifier: .stepCount)!
                  let now = Date()
                  let start = Calendar.current.startOfDay(for: now)
                  let sample = HKQuantitySample(
                      type: type,
                      quantity: HKQuantity(unit: .count(), doubleValue: Double(n)),
                      start: start,
                      end: now
                  )
                  healthStore.save(sample) { success, error in
                      DispatchQueue.main.async {
                          busy = false
                          if success {
                              status = "✅ 已写入 \(n) 步"
                          } else {
                              status = "⚠️ 写入失败：\(error?.localizedDescription ?? "未知错误")"
                          }
                      }
                  }
              }

              func handleURL(_ url: URL) {
                  guard let comps = URLComponents(url: url, resolvingAgainstBaseURL: false) else { return }
                  if let c = comps.queryItems?.first(where: { $0.name == "count" })?.value, let n = Int(c) {
                      countText = String(n)
                      writeSteps()
                      return
                  }
                  if let loS = comps.queryItems?.first(where: { $0.name == "min" })?.value,
                     let hiS = comps.queryItems?.first(where: { $0.name == "max" })?.value,
                     let lo = Int(loS), let hi = Int(hiS), hi >= lo {
                      let n = Int.random(in: lo...hi)
                      countText = String(n)
                      writeSteps()
                  }
              }
          }
          SWIFT_EOF

          cat > project.yml <<'YML_EOF'
          name: StepSync
          options:
            bundleIdPrefix: com.stepsync
            deploymentTarget:
              iOS: "15.0"
            projectFormat: Xcode14
          targets:
            StepSync:
              type: application
              platform: iOS
              sources:
                - path: StepSyncApp.swift
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: StepSync
                  CFBundleURLTypes:
                    - CFBundleURLName: stepsync
                      CFBundleURLSchemes:
                        - stepsync
                  NSHealthUpdateUsageDescription: "StepSync 需要把步数写入您的健康"
                  NSHealthShareUsageDescription: "StepSync 需要读取您的步数以回显"
              entitlements:
                path: StepSync.entitlements
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.stepsync.stepsync
                  CODE_SIGN_ENTITLEMENTS: StepSync.entitlements
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGN_IDENTITY: ""
          YML_EOF

          cat > StepSync.entitlements <<'ENT_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.healthkit</key>
              <true/>
          </dict>
          </plist>
          ENT_EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -e -o pipefail
          xcodebuild -project StepSync.xcodeproj \
            -target StepSync \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build 2>&1 | tee build.log

      - name: Locate .app
        id: locate
        run: |
          APP=$(find build/Build/Products -name "StepSync.app" -maxdepth 2 | head -1)
          echo "APP=$APP" >> "$GITHUB_OUTPUT"
          echo "found: $APP"

      - name: Build .deb (rootless / iphoneos-arm64)
        run: |
          APP="${{ steps.locate.outputs.APP }}"
          rm -rf pkg
          mkdir -p pkg/Applications/StepSync.app
          cp -R "$APP/." pkg/Applications/StepSync.app/
          mkdir -p pkg/DEBIAN
          cat > pkg/DEBIAN/control <<'CTRL_EOF'
          Package: com.stepsync.stepsync
          Name: StepSync
          Version: 1.0.0
          Architecture: iphoneos-arm64
          Description: 步数写入苹果健康（rootless 越狱）
          Maintainer: Tk5680850
          Section: Utilities
          CTRL_EOF
          chmod 755 pkg/Applications/StepSync.app/StepSync
          dpkg-deb -bZgzip pkg StepSync.deb
          ls -la StepSync.deb

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rootless-build-${{ github.run_number }}
          name: StepSync rootless build #${{ github.run_number }}
          files: StepSync.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log